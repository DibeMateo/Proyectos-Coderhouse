{% extends 'posts/base.html' %}

{% block title %}Eliminar post{% endblock %}

{% block content %}
    <h1>Eliminar post</h1>
    <p>¿Seguro que querés eliminar <strong>{{ post.titulo }}</strong>? Esta acción no se puede deshacer.</p>

    <form method="post" class="formulario">
        {% csrf_token %}
        <button type="submit" class="boton boton-peligro">Sí, eliminar</button>
        <a class="boton boton-secundario" href="{% url 'detalle_post' post.pk %}">Cancelar</a>
    </form>
{% endblock %}
