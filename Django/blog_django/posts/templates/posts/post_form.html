{% extends 'posts/base.html' %}

{% block title %}{{ titulo_pagina }}{% endblock %}

{% block content %}
    <h1>{{ titulo_pagina }}</h1>

    {% if post and post.imagen %}
        <p>Imagen actual:</p>
        <img class="post-imagen" src="{{ post.imagen.url }}" alt="{{ post.titulo }}">
    {% endif %}

    <form method="post" enctype="multipart/form-data" class="formulario">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="boton">{{ texto_boton }}</button>
        <a class="boton boton-secundario" href="{% url 'lista_posts' %}">Cancelar</a>
    </form>
{% endblock %}
