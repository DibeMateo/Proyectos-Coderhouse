{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Blog{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'posts/css/estilos.css' %}">
</head>
<body>
    <nav class="navbar">
        <a href="{% url 'inicio' %}">Inicio</a>
        <a href="{% url 'lista_posts' %}">Publicaciones</a>
        <a href="{% url 'acerca' %}">Acerca de</a>

        {% if user.is_authenticated %}
            <a href="{% url 'crear_post' %}">Nuevo post</a>
            <a href="{% url 'perfil' %}">Mi perfil ({{ user.username }})</a>
            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn-link">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Iniciar sesión</a>
            <a href="{% url 'registro' %}">Registrarse</a>
        {% endif %}
    </nav>

    <main class="contenido">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
